name: Pull request checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: PR changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test .github/scripts/validate-pr.test.mjs
      - run: node .github/scripts/validate-pr.mjs

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --check .github/pull_request_template.md .github/scripts/*.mjs .github/workflows/pull-request.yml
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build

  validation:
    name: validation
    if: always()
    needs: [description, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both checks to pass
        env:
          DESCRIPTION_RESULT: ${{ needs.description.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$DESCRIPTION_RESULT" = success && test "$QUALITY_RESULT" = success
